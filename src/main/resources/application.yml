spring:
  application:
    name: ymh-ai-coder-mother-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ymh_ai_code_mother
    username: root
    password: 123456
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.heima.ymhaicodermother.controller
  # knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
